name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/main.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.2"
          bundler-cache: true

      - name: Verify tag and version
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(ruby -e 'require "./lib/typesafe/sdk/version"; print Typesafe::SDK::VERSION')"

          if [ "$tag" != "v$version" ]; then
            echo "tag $tag does not match version.rb ($version)"
            exit 1
          fi

          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag $tag points at a commit that is not on main"
            exit 1
          fi

          status="$(curl -s -o /dev/null -w '%{http_code}' "https://rubygems.org/api/v2/rubygems/typesafe-sdk/versions/$version.json")"
          if [ "$status" = "200" ]; then
            echo "typesafe-sdk $version is already on rubygems"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build gem
        run: gem build typesafe-sdk.gemspec

      - name: Configure rubygems credentials
        uses: rubygems/configure-rubygems-credentials@v2.1.0

      - name: Push gem
        run: gem push "typesafe-sdk-${{ steps.version.outputs.version }}.gem"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "typesafe-sdk-${{ steps.version.outputs.version }}.gem" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
